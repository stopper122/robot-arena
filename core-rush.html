<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Core Rush · Robot Arena</title>
<link rel="stylesheet" href="css/game.css?v=5">
<script type="importmap">{ "imports": { "./js/input.js": "./js/input.js?v=5", "./js/audio.js": "./js/audio.js?v=5", "./js/lobby.js": "./js/lobby.js?v=5", "./js/drive.js": "./js/drive.js?v=5", "./js/scene3d.js": "./js/scene3d.js?v=5" } }</script>
</head>
<body>
<canvas id="c" class="game"></canvas>
<div class="corner-help">Esc = players · F = full screen</div>
<script type="module">
import { pollInputs, endInputFrame, sources } from './js/input.js';
import { sfx, unlockAudio } from './js/audio.js';
import { createLobby, createHud, COLORS, TIME_SELECT, SPEED_SELECT, fmtTime } from './js/lobby.js';
import { SPEEDS, driveInput, stepRobot } from './js/drive.js';

// ---------- constants (field units are inches; a VEX field is 144" = 12 ft) ----------
const FIELD = 144, R_ROBOT = 10.5, R_BALL = 3.5, GOAL_R = 10, POST_R = 5, MAX_HELD = 2;
const GOALS = { red: { x: 130, y: 72 }, blue: { x: 14, y: 72 } };
const SHOOT = ['R1', 'R2', 'L1', 'L2'];
const STARTS = { red: [[26, 40, 0], [26, 104, 0]], blue: [[118, 40, Math.PI], [118, 104, Math.PI]] };
const BALL_START = [[72, 20], [72, 46], [72, 72], [72, 98], [72, 124], [50, 30], [50, 114], [94, 30], [94, 114],
  [46, 72], [98, 72], [32, 56], [32, 88], [112, 56], [112, 88], [60, 86], [84, 58]];

const hud = createHud();
const lobby = createLobby({
  title: 'Core Rush', tag: '★★ Medium · 2D', teams: true,
  rules: 'Drive into the <b style="color:var(--core)">yellow cores</b> to pick them up (you can carry 2). Shoot them into <b>your team\'s goal</b>: <b style="color:var(--red)">Red</b> scores on the right, <b style="color:var(--blue)">Blue</b> scores on the left. Shot in = <b>3 points</b>, pushed in = <b>1 point</b>.',
  hint: 'Shoot with <kbd>R1</kbd> / <kbd>R2</kbd> / <kbd>L1</kbd> / <kbd>L2</kbd>. Left/right arrows pick a team.',
  selects: [TIME_SELECT('60'), SPEED_SELECT('normal')],
  onStart: startMatch, onLobby: () => { state = 'lobby'; hud.hide(); },
});

// ---------- match ----------
let state = 'lobby', robots = [], balls = [], popups = [], score = { red: 0, blue: 0 };
let matchLen = 60, timeLeft = 60, countdown = 0, lastBeep = 0, speed = SPEEDS.normal;

function startMatch() {
  unlockAudio();
  const o = lobby.options();
  matchLen = +o.time; speed = SPEEDS[o.speed];
  timeLeft = matchLen; score = { red: 0, blue: 0 }; popups = [];
  const used = { red: 0, blue: 0 };
  robots = lobby.players.map(p => {
    const [x, y, th] = STARTS[p.team][used[p.team]++ % 2];
    return { p, x, y, th, v: 0, w: 0, held: 0, cool: 0, points: 0, shots: 0, made: 0 };
  });
  balls = BALL_START.map(([x, y]) => ({ x, y, vx: 0, vy: 0, st: 'roll', t: 0, by: null }));
  state = 'countdown'; countdown = 3.999; lastBeep = 4;
}
function endMatch() {
  state = 'end'; sfx.end();
  const title = score.red > score.blue ? 'Red wins!' : score.blue > score.red ? 'Blue wins!' : "It's a tie!";
  const color = score.red > score.blue ? 'var(--red)' : score.blue > score.red ? 'var(--blue)' : 'var(--core)';
  lobby.showEnd(title, color,
    `<div class="scores"><span style="color:var(--red)">${score.red}</span><span>–</span><span style="color:var(--blue)">${score.blue}</span></div>
     <table class="stats"><tr><th>Player</th><th>Team</th><th>Shots</th><th>Shots in</th><th>Points scored</th></tr>` +
    robots.map(r => `<tr><td><b>${r.p.name}</b></td><td style="color:var(--${r.p.team})">${COLORS[r.p.team].name}</td><td>${r.shots}</td><td>${r.made}</td><td>${r.points}</td></tr>`).join('') + '</table>');
}

function shoot(r) {
  if (r.held <= 0 || r.cool > 0) return;
  r.held--; r.cool = 0.35; r.shots++;
  const c = Math.cos(r.th), s = Math.sin(r.th), d = R_ROBOT + R_BALL + 1;
  const sp = 125 + Math.max(0, r.v);
  balls.push({ x: r.x + c * d, y: r.y + s * d, vx: c * sp, vy: s * sp, st: 'fly', t: 0.55, by: r });
  sfx.shoot();
}

function respawnBall(b) {
  for (let tries = 0; tries < 30; tries++) {
    const x = 52 + Math.random() * 40, y = 12 + Math.random() * 120;
    if (robots.every(r => Math.hypot(r.x - x, r.y - y) > R_ROBOT + 8) && balls.every(o => o === b || o.st === 'gone' || Math.hypot(o.x - x, o.y - y) > 8)) {
      Object.assign(b, { x, y, vx: 0, vy: 0, st: 'roll', t: 0, pop: 0.4 }); return;
    }
  }
  Object.assign(b, { x: 72, y: 72, vx: 0, vy: 0, st: 'roll', t: 0, pop: 0.4 });
}

function step(dt) {
  for (const r of robots) {
    const [tv, tw] = driveInput(r.p, speed);
    stepRobot(r, tv, tw, speed, dt);
    r.cool = Math.max(0, r.cool - dt);
    const s = sources.get(r.p.src);
    if (s && SHOOT.some(b => s.btn.has(b))) shoot(r);
  }
  for (let i = 0; i < robots.length; i++) {
    const a = robots[i];
    for (let j = i + 1; j < robots.length; j++) {
      const b = robots[j], dx = b.x - a.x, dy = b.y - a.y, d = Math.hypot(dx, dy) || 0.01, o = 2 * R_ROBOT - d;
      if (o > 0) { const nx = dx / d, ny = dy / d; a.x -= nx * o / 2; a.y -= ny * o / 2; b.x += nx * o / 2; b.y += ny * o / 2; }
    }
    for (const g of Object.values(GOALS)) {
      const dx = a.x - g.x, dy = a.y - g.y, d = Math.hypot(dx, dy) || 0.01, o = R_ROBOT + POST_R - d;
      if (o > 0) { a.x += dx / d * o; a.y += dy / d * o; }
    }
    a.x = Math.max(R_ROBOT, Math.min(FIELD - R_ROBOT, a.x));
    a.y = Math.max(R_ROBOT, Math.min(FIELD - R_ROBOT, a.y));
  }
  for (const b of balls) {
    if (b.st === 'gone') { if ((b.t -= dt) <= 0) respawnBall(b); continue; }
    if (b.pop) b.pop = Math.max(0, b.pop - dt);
    b.x += b.vx * dt; b.y += b.vy * dt;
    const f = Math.exp((b.st === 'fly' ? -0.5 : -2.2) * dt);
    b.vx *= f; b.vy *= f;
    if (Math.hypot(b.vx, b.vy) < 1.5) b.vx = b.vy = 0;
    if (b.st === 'fly' && (b.t -= dt) <= 0) b.st = 'roll';
    if (b.x < R_BALL) { b.x = R_BALL; b.vx = Math.abs(b.vx) * 0.6; }
    if (b.x > FIELD - R_BALL) { b.x = FIELD - R_BALL; b.vx = -Math.abs(b.vx) * 0.6; }
    if (b.y < R_BALL) { b.y = R_BALL; b.vy = Math.abs(b.vy) * 0.6; }
    if (b.y > FIELD - R_BALL) { b.y = FIELD - R_BALL; b.vy = -Math.abs(b.vy) * 0.6; }
    for (const [team, g] of Object.entries(GOALS)) {
      if (Math.hypot(b.x - g.x, b.y - g.y) < GOAL_R) {
        const pts = b.st === 'fly' ? 3 : 1;
        score[team] += pts;
        if (b.by && b.by.p.team === team) { b.by.points += pts; if (pts === 3) b.by.made++; }
        popups.push({ x: g.x, y: g.y - 6, text: '+' + pts, color: COLORS[team].main, t: 1.2 });
        (pts === 3 ? sfx.score3 : sfx.score1)();
        b.st = 'gone'; b.t = 1.5; b.by = null;
        break;
      }
    }
    if (b.st !== 'roll') continue;
    for (const r of robots) {
      const c = Math.cos(r.th), s = Math.sin(r.th);
      const fx = r.x + c * 9, fy = r.y + s * 9;
      if (r.held < MAX_HELD && Math.hypot(b.x - fx, b.y - fy) < R_BALL + 5) {
        r.held++; b.st = 'gone'; b.t = 1e9; b.held = r; sfx.grab(); break;
      }
      const dx = b.x - r.x, dy = b.y - r.y, d = Math.hypot(dx, dy) || 0.01, o = R_ROBOT + R_BALL - d;
      if (o > 0) {
        const nx = dx / d, ny = dy / d;
        b.x += nx * o; b.y += ny * o;
        const rv = (c * nx + s * ny) * r.v;
        const bv = b.vx * nx + b.vy * ny;
        if (bv < rv * 1.1) { b.vx += nx * (rv * 1.1 - bv); b.vy += ny * (rv * 1.1 - bv); }
        b.by = r;
      }
    }
  }
  const rolling = balls.filter(b => b.st === 'roll');
  for (let i = 0; i < rolling.length; i++) for (let j = i + 1; j < rolling.length; j++) {
    const a = rolling[i], b = rolling[j], dx = b.x - a.x, dy = b.y - a.y, d = Math.hypot(dx, dy);
    if (d > 0 && d < 2 * R_BALL) {
      const nx = dx / d, ny = dy / d, o = 2 * R_BALL - d;
      a.x -= nx * o / 2; a.y -= ny * o / 2; b.x += nx * o / 2; b.y += ny * o / 2;
      const va = a.vx * nx + a.vy * ny, vb = b.vx * nx + b.vy * ny;
      if (va - vb > 0) { a.vx += (vb - va) * nx; a.vy += (vb - va) * ny; b.vx += (va - vb) * nx; b.vy += (va - vb) * ny; }
    }
  }
  // a held core is a parked placeholder; when one is shot, a new ball object flies, so drop a placeholder
  for (const r of robots) {
    const onBoard = balls.filter(b => b.held === r && b.st === 'gone').length;
    if (onBoard > r.held) balls.splice(balls.indexOf(balls.find(b => b.held === r && b.st === 'gone')), 1);
  }
  popups.forEach(p => p.t -= dt); popups = popups.filter(p => p.t > 0);
}

// ---------- drawing ----------
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
let W = 0, H = 0, S = 1, OX = 0, OY = 0;
const HUD = 76;
function resize() {
  const dpr = devicePixelRatio || 1;
  W = innerWidth; H = innerHeight;
  cv.width = W * dpr; cv.height = H * dpr; ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  const size = Math.min(W - 24, H - HUD - 16);
  S = size / FIELD; OX = (W - size) / 2; OY = HUD + 4;
}
addEventListener('resize', resize); resize();
function rr(x, y, w, h, r) { ctx.beginPath(); ctx.roundRect(x, y, w, h, r); }

function drawField() {
  ctx.save(); ctx.translate(OX, OY); ctx.scale(S, S);
  for (let i = 0; i < 6; i++) for (let j = 0; j < 6; j++) { ctx.fillStyle = (i + j) % 2 ? '#8d95a3' : '#949cab'; ctx.fillRect(i * 24, j * 24, 24, 24); }
  ctx.strokeStyle = 'rgba(255,255,255,.12)'; ctx.lineWidth = 0.4;
  for (let i = 1; i < 6; i++) { ctx.beginPath(); ctx.moveTo(i * 24, 0); ctx.lineTo(i * 24, FIELD); ctx.moveTo(0, i * 24); ctx.lineTo(FIELD, i * 24); ctx.stroke(); }
  ctx.strokeStyle = '#fff'; ctx.lineWidth = 1; ctx.setLineDash([3, 3]);
  ctx.beginPath(); ctx.moveTo(72, 0); ctx.lineTo(72, FIELD); ctx.stroke(); ctx.setLineDash([]);
  for (const [team, g] of Object.entries(GOALS)) {
    ctx.fillStyle = team === 'red' ? 'rgba(229,72,77,.35)' : 'rgba(62,140,240,.35)';
    ctx.beginPath(); ctx.arc(g.x, g.y, GOAL_R, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = COLORS[team].main; ctx.lineWidth = 2.2; ctx.stroke();
    ctx.fillStyle = COLORS[team].dark; ctx.beginPath(); ctx.arc(g.x, g.y, POST_R, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#fff'; ctx.font = 'bold 4px Segoe UI, sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText('GOAL', g.x, g.y + GOAL_R + 4);
  }
  ctx.strokeStyle = '#d7dce4'; ctx.lineWidth = 2.5; ctx.strokeRect(-1.25, -1.25, FIELD + 2.5, FIELD + 2.5);
  ctx.restore();
}
function drawBall(b) {
  const fly = b.st === 'fly', lift = fly ? Math.sin(Math.min(1, b.t / 0.55) * Math.PI) * 4 : 0;
  const scale = (1 + lift / 9) * (b.pop ? 1 + b.pop : 1);
  if (fly) { ctx.fillStyle = 'rgba(0,0,0,.25)'; ctx.beginPath(); ctx.arc(b.x, b.y, R_BALL, 0, Math.PI * 2); ctx.fill(); }
  const y = b.y - lift;
  const grd = ctx.createRadialGradient(b.x - 1, y - 1, 0.5, b.x, y, R_BALL * scale);
  grd.addColorStop(0, '#fff6c2'); grd.addColorStop(0.5, '#ffd23f'); grd.addColorStop(1, '#c79300');
  ctx.fillStyle = grd; ctx.beginPath(); ctx.arc(b.x, y, R_BALL * scale, 0, Math.PI * 2); ctx.fill();
}
function drawRobot(r) {
  const { main: col, dark } = COLORS[r.p.team];
  ctx.save(); ctx.translate(r.x, r.y);
  ctx.fillStyle = 'rgba(0,0,0,.3)'; rr(-8.5, -8, 18, 18, 3); ctx.fill();
  ctx.rotate(r.th);
  ctx.fillStyle = '#222'; for (const [x, y] of [[-7, -10], [3, -10], [-7, 8], [3, 8]]) { rr(x, y, 5, 2.2, 0.8); ctx.fill(); }
  ctx.fillStyle = col; rr(-9, -9, 18, 18, 3); ctx.fill();
  ctx.strokeStyle = dark; ctx.lineWidth = 1.2; ctx.stroke();
  ctx.fillStyle = '#3a3f4a'; rr(7.5, -8, 3.5, 16, 1); ctx.fill();
  ctx.fillStyle = '#5c6372'; for (let k = -6; k <= 6; k += 4) ctx.fillRect(8.2, k - 0.5, 2.2, 1);
  ctx.fillStyle = 'rgba(255,255,255,.9)'; ctx.beginPath(); ctx.moveTo(6, 0); ctx.lineTo(0, -4); ctx.lineTo(0, 4); ctx.closePath(); ctx.fill();
  for (let k = 0; k < r.held; k++) { ctx.fillStyle = '#ffd23f'; ctx.strokeStyle = '#a67a00'; ctx.lineWidth = 0.6; ctx.beginPath(); ctx.arc(-4, k ? 3.5 : -3.5, 2.6, 0, Math.PI * 2); ctx.fill(); ctx.stroke(); }
  ctx.restore();
  ctx.fillStyle = '#fff'; ctx.strokeStyle = 'rgba(0,0,0,.6)'; ctx.lineWidth = 1.2;
  ctx.font = 'bold 6px Segoe UI, sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.strokeText(r.p.name, r.x, r.y - 15); ctx.fillText(r.p.name, r.x, r.y - 15);
  const s = sources.get(r.p.src);
  if (s && !s.alive) { ctx.fillStyle = '#ffb347'; ctx.font = 'bold 4px Segoe UI'; ctx.fillText('NO SIGNAL', r.x, r.y + 15); }
}
function draw() {
  ctx.fillStyle = '#12151c'; ctx.fillRect(0, 0, W, H);
  drawField();
  ctx.save(); ctx.translate(OX, OY); ctx.scale(S, S);
  balls.forEach(b => b.st === 'roll' && drawBall(b));
  robots.forEach(drawRobot);
  balls.forEach(b => b.st === 'fly' && drawBall(b));
  for (const p of popups) {
    ctx.globalAlpha = Math.min(1, p.t * 2); ctx.fillStyle = p.color; ctx.strokeStyle = '#fff'; ctx.lineWidth = 1.5;
    ctx.font = '900 12px Segoe UI, sans-serif'; ctx.textAlign = 'center';
    const y = p.y - (1.2 - p.t) * 12; ctx.strokeText(p.text, p.x, y); ctx.fillText(p.text, p.x, y);
  }
  ctx.globalAlpha = 1; ctx.restore();
}

// ---------- main loop ----------
addEventListener('keydown', e => { if (e.code === 'Escape') state === 'lobby' ? location.href = './' : lobby.show(); });
let last = performance.now();
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  pollInputs();
  if (state === 'lobby') lobby.update();
  else if (state === 'countdown') {
    hud.show();
    countdown -= dt;
    const n = Math.ceil(countdown - 1);
    if (n !== lastBeep) { lastBeep = n; n > 0 ? sfx.beep() : sfx.go(); }
    hud.big(n > 0 ? String(n) : 'GO!', n > 0 ? '#fff' : 'var(--go)');
    if (countdown <= 0.6) { state = 'play'; hud.big(''); }
  } else if (state === 'play') {
    for (let k = 0; k < 2; k++) step(dt / 2);
    if (matchLen) {
      const before = Math.ceil(timeLeft); timeLeft -= dt;
      if (Math.ceil(timeLeft) !== before && timeLeft <= 5 && timeLeft > 0) sfx.beep();
      if (timeLeft <= 0) { timeLeft = 0; endMatch(); }
    }
  } else if (state === 'end') lobby.endUpdate();
  if (state !== 'lobby') hud.set([{ label: 'RED', value: score.red, color: COLORS.red.main }, { label: 'BLUE', value: score.blue, color: COLORS.blue.main }], matchLen ? fmtTime(timeLeft) : '∞');
  draw();
  endInputFrame();
  requestAnimationFrame(frame);
}
balls = BALL_START.map(([x, y]) => ({ x, y, vx: 0, vy: 0, st: 'roll', t: 0 }));
requestAnimationFrame(frame);
</script>
</body>
</html>
